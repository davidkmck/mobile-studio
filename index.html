<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mobile Studio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app-container">
    <iframe id="beat-maker" class="app-frame active" src="apps/beat-maker/index.html"></iframe>
    <iframe id="multitrack" class="app-frame" src="apps/multitrack/index.html"></iframe>
    <iframe id="synth" class="app-frame" src="apps/synth/index.html"></iframe>
    <iframe id="mic-recorder" class="app-frame" src="apps/mic-recorder/index.html"></iframe>
  </div>

  <div class="studio-rack">
    
    <!-- BEAT (Drum Kit) -->
    <a href="#" class="rack-device drum-kit-tab active" data-app="beat-maker" onclick="loadApp('beat-maker', event)">
      
      <!-- Consistent Hardware Header -->
      <div class="device-header" style="position: absolute; top: 0; left: 0; right: 0; height: 24px; background: linear-gradient(to bottom, rgba(30,30,30,0.95), rgba(15,15,15,0.85)); border-bottom: 1px solid #444; border-radius: 4px 4px 0 0; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; z-index: 30; pointer-events: none;">
          <!-- Green Selected Indicator -->
          <div class="status-led" style="width: 8px; height: 8px; border-radius: 50%; background-color: #33ff33; box-shadow: 0 0 5px #33ff33;"></div>
          <!-- ARM Toggle -->
          <div class="arm-toggle" onclick="event.stopPropagation()" style="pointer-events: auto; display: flex; align-items: center; gap: 4px;">
              <input type="checkbox" id="arm-beat-maker" checked>
              <label for="arm-beat-maker" style="color: #ff4444; font-size: 10px; font-weight: bold; margin: 0; cursor: pointer; text-shadow: 0 0 2px #ff4444;">ARM</label>
          </div>
      </div>

      <div class="drum-interface" style="padding-top: 24px; box-sizing: border-box; height: 100%;">
        <div class="drum-top-row">
          <div class="drum-screen">KIT</div>
          <div class="drum-knob"></div>
        </div>
        
        <div class="drum-top-row">
          <div class="drum-screen">KIT</div>
          <div class="drum-knob"></div>
        </div>
        
        <div class="drum-pads">
          <div class="drum-pad"></div>
          <div class="drum-pad"></div>
          <div class="drum-pad"></div>
          <div class="drum-pad"></div>
        </div>
      </div>
      <div class="audio-port" style="left: 50%;"></div>
    </a>

    <!-- TRACKS (The Mixer Board) -->
    <a href="#" class="rack-device mixer-tab" data-app="multitrack" onclick="loadApp('multitrack', event)">
      <div class="mixer-interface">
        <div class="mixer-channel ch-1">
          <div class="mixer-knob"></div>
          <div class="mixer-fader-track"><div class="mixer-fader-cap"></div></div>
          <div class="mixer-led"></div>
        </div>
        <div class="mixer-channel ch-2">
          <div class="mixer-knob"></div>
          <div class="mixer-fader-track"><div class="mixer-fader-cap"></div></div>
          <div class="mixer-led"></div>
        </div>
        <div class="mixer-channel ch-3">
          <div class="mixer-knob"></div>
          <div class="mixer-fader-track"><div class="mixer-fader-cap"></div></div>
          <div class="mixer-led"></div>
        </div>
      </div>
      <div class="audio-port port-left" style="left: 25%;"></div>
      <div class="audio-port port-right" style="left: 75%;"></div>
    </a>

    <!-- SYNTH (Keyboard) -->
    <a href="#" class="rack-device synth-tab" data-app="synth" onclick="loadApp('synth', event)">
      
      <!-- Consistent Hardware Header -->
      <div class="device-header" style="position: absolute; top: 0; left: 0; right: 0; height: 24px; background: linear-gradient(to bottom, rgba(30,30,30,0.95), rgba(15,15,15,0.85)); border-bottom: 1px solid #444; border-radius: 4px 4px 0 0; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; z-index: 30; pointer-events: none;">
        <!-- Green Selected Indicator -->
        <div class="status-led" style="width: 8px; height: 8px; border-radius: 50%; background-color: #33ff33; box-shadow: 0 0 5px #33ff33;"></div>
        <!-- ARM Toggle -->
        <div class="arm-toggle" onclick="event.stopPropagation()" style="pointer-events: auto; display: flex; align-items: center; gap: 4px;">
          <input type="checkbox" id="arm-synth" checked>
          <label for="arm-synth" style="color: #ff4444; font-size: 10px; font-weight: bold; margin: 0; cursor: pointer; text-shadow: 0 0 2px #ff4444;">ARM</label>
        </div>
      </div>

      <div class="keyboard-interface" style="padding-top: 24px; box-sizing: border-box; height: 100%;">
        
        <!-- White Keys Layer -->
        <div class="white-keys-layer">
          <div class="white-key"></div>
          <div class="white-key"></div>
          <div class="white-key"></div>
          <div class="white-key"></div>
          <div class="white-key"></div>
          <div class="white-key"></div>
          <div class="white-key"></div>
        </div>
        
        <!-- Black Keys Overlay Layer -->
        <div class="black-keys-layer">
          <div class="black-key bk-1"></div>
          <div class="black-key bk-2"></div>
          <div class="black-key bk-3"></div>
          <div class="black-key bk-4"></div>
          <div class="black-key bk-5"></div>
        </div>
      </div>
      <div class="audio-port" style="left: 50%;"></div>
    </a>

    <!-- MIC / RECORDER UNIT -->
    <a href="#" class="rack-device mic-tab" data-app="mic-recorder" onclick="loadApp('mic-recorder', event)">
      
      <!-- Consistent Hardware Header -->
      <div class="device-header" style="position: absolute; top: 0; left: 0; right: 0; height: 24px; background: linear-gradient(to bottom, rgba(30,30,30,0.95), rgba(15,15,15,0.85)); border-bottom: 1px solid #444; border-radius: 4px 4px 0 0; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; z-index: 30; pointer-events: none;">
        <!-- Green Selected Indicator -->
        <div class="status-led" style="width: 8px; height: 8px; border-radius: 50%; background-color: #33ff33; box-shadow: 0 0 5px #33ff33;"></div>
        <!-- ARM Toggle -->
        <div class="arm-toggle" onclick="event.stopPropagation()" style="pointer-events: auto; display: flex; align-items: center; gap: 4px;">
          <input type="checkbox" id="arm-mic-recorder" checked>
          <label for="arm-mic-recorder" style="color: #ff4444; font-size: 10px; font-weight: bold; margin: 0; cursor: pointer; text-shadow: 0 0 2px #ff4444;">ARM</label>
        </div>
      </div>

      <div class="mic-interface" style="padding-top: 24px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
        <div class="mic-screen" style="background: #111; color: #0ff; font-family: monospace; padding: 6px 12px; border: 1px solid #333; border-radius: 4px; font-size: 12px; letter-spacing: 1px;">MIC FX</div>
        <div class="mic-icon-graphic" style="font-size: 24px;">🎙️</div>
      </div>
      <div class="audio-port" style="left: 50%;"></div>
    </a>
    
    <!-- The Vector Canvas Overlay -->
    <svg class="patch-bay-canvas" xmlns="http://www.w3.org/2000/svg">
      <path class="cable-left" d="M 0 0" />
      <path class="cable-right" d="M 0 0" />
    </svg>

    <!-- Global Transport -->
    <div class="global-transport" style="position: absolute; top: -50px; left: 50%; transform: translateX(-50%); z-index: 10;">
        <button id="global-record-btn" style="padding: 10px 20px; font-weight: bold; background: #333; color: white; border: 2px solid #555; border-radius: 5px; cursor: pointer;">
            🔴 REC
        </button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
